name: Stage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/stage.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute the version only, without tagging a staging build
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  stage:
    uses: photon-hq/buildspace/.github/workflows/swift-stage.yml@345cd435ad8eb1240b001b7147968fb71e8e62e5
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
      pull-requests: read
    with:
      package-name: Astrolabe
      library: true
      dry-run: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
