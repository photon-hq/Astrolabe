name: Promote

on:
  workflow_dispatch:
    inputs:
      staging-version:
        description: Staging build to promote, such as 1.4.0-staging.123456789.1; blank promotes the newest
        type: string
        default: ''

permissions:
  contents: read

jobs:
  promote:
    uses: photon-hq/buildspace/.github/workflows/swift-promote.yml@345cd435ad8eb1240b001b7147968fb71e8e62e5
    permissions:
      contents: write
      actions: read
      attestations: read
    with:
      package-name: Astrolabe
      library: true
      staging-version: ${{ inputs.staging-version }}
